services:
  # ── Auth Service ──────────────────────────────────────────────────────────

  - type: web
    name: auth-service
    runtime: node
    rootDir: services/auth
    region: oregon
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: FRONTEND_URL
        sync: false

  # ── Workers Service ───────────────────────────────────────────────────────

  - type: web
    name: workers-service
    runtime: node
    rootDir: services/workers
    region: oregon
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false

  # ── Referrals Service ─────────────────────────────────────────────────────

  - type: web
    name: referrals-service
    runtime: node
    rootDir: services/referrals
    region: oregon
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false

  # ── Assistance Service ────────────────────────────────────────────────────

  - type: web
    name: assistance-service
    runtime: node
    rootDir: services/assistance
    region: oregon
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false

  # ── Reports Service ───────────────────────────────────────────────────────

  - type: web
    name: reports-service
    runtime: node
    rootDir: services/reports
    region: oregon
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false

  # ── Frontend (Static Site) ────────────────────────────────────────────────

  - type: web
    name: frontend
    runtime: static
    rootDir: apps/frontend
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: ./apps/frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_AUTH_URL
        sync: false
      - key: VITE_API_WORKERS_URL
        sync: false
      - key: VITE_API_REFERRALS_URL
        sync: false
      - key: VITE_API_ASSISTANCE_URL
        sync: false
      - key: VITE_API_REPORTS_URL
        sync: false
